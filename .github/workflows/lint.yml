name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint all projects
        run: ruff check 01_Perceptron/ 02_Gradient_Descent/ 03_Backpropagation/ 04_CNNs_with_Keras/ 05_RNNs_and_Sentiment/
